[project]
name = "flex2rijk"
version = "0.1.0"
description = "Automatische login tool voor flex2rijk.nl Citrix werkplek"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
]

[project.scripts]
flex2rijk = "flex2rijk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flex2rijk"]
